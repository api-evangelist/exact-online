aid: exact-online
name: Exact Online
description: >-
  Exact Online is a Dutch cloud business software suite from Exact (Delft, NL)
  serving SMEs and accountants with accounting, ERP, invoicing, CRM, project
  management, and AI-driven automation, used by more than 675,000 companies.
  The platform exposes a comprehensive REST and OData API covering financial,
  HRM, logistics, CRM, and project data across regional deployments
  (start.exactonline.nl, .co.uk, .be, .de, .fr, .es, .com). Authentication is
  via OAuth 2.0 with regional authorization and token endpoints.
