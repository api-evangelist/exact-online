apis:
  - aid: exact-online:rest-api
    name: Exact Online REST / OData API
    description: >-
      REST and OData API (v1) for Exact Online covering financials, sales,
      purchasing, inventory, HRM, CRM, project management, and master data.
      Authentication is OAuth 2.0; applications register in the Exact App
      Center and use regional auth/token endpoints (e.g. start.exactonline.nl
      for the Netherlands, start.exactonline.co.uk for the UK).
    humanURL: https://start.exactonline.nl/docs/HlpRestAPIResources.aspx
